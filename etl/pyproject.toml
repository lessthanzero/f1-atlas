[project]
name = "f1-atlas-etl"
version = "0.1.0"
description = "Reproducible ETL for F1 Atlas"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
f1-atlas-etl = "f1_atlas_etl.build:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["f1_atlas_etl*"]
